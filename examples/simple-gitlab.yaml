# Minimal setup for a single GitLab repo with GitLab Issues.
# Replies require at least one configured responder.

dataDir: ~/.agent-orchestrator
worktreeDir: ~/.worktrees

defaults:
  issueAssistant:
    enabled: true
    maxConcurrentIssues: 3
    mentionTriggers: ["@codex", "@helper"]
    responders:
      - id: codex
        command: codex
        args: ["exec", "--json"]
        timeout: 10m

projects:
  sample-gitlab:
    issueTracker:
      provider: gitlab
      # Use glab/gosmee for long-running runs.
      eventSource:
        type: glab/polling
        pollInterval: 30s
      # eventSource:
      #   type: glab/gosmee
      #   reconciliation: continuous
      #   reconcileInterval: 30s
    scm:
      provider: gitlab
    repo: group/subgroup/repo
    path: ~/repo
    defaultBranch: main
