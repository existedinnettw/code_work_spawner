# Minimal setup for a single Gitea repo with Gitea Issues.
# Replies require at least one configured responder.

dataDir: ~/.agent-orchestrator
worktreeDir: ~/.worktrees

defaults:
  issueAssistant:
    enabled: true
    maxConcurrentIssues: 3
    maxResponsesAfterHuman: 1
    mentionTriggers: ["@codex", "@helper"]
    responders:
      - id: codex
        command: codex
        args: ["exec", "--json"]
        timeout: 10m

projects:
  sample-gitea:
    issueTracker:
      provider: gitea
      # Use tea/gosmee for long-running runs.
      eventSource:
        type: tea/polling
        pollInterval: 30s
      # eventSource:
      #   type: tea/gosmee
      #   reconciliation: startup-only
      #   reconcileInterval: 30s
    scm:
      provider: gitea
    repo: owner/repo
    path: ~/repo
    defaultBranch: main
